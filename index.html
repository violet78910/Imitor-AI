<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imitor AI</title>
  <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <img src="assets/logoAlt.svg" alt="logo" id="logo">
    <h1>Imitor AI</h1>
  </header>
  <main>
    <h2 id="welcomeMessage">Welcome to Imitor AI</h2>
    <div id="chat"></div>
  </main>
  <footer>
    <textarea name="prompt" id="prompt" placeholder="Ask Imitor AI" autocomplete="off" autocorrect="on"></textarea>
    <button type="button" id="sendMessage" disabled aria-label="Send message">⬆︎</button>
  </footer>
  <script src="scripts/chatUtils.js"></script>
  <script src="scripts/ui.js"></script>
  <script src="scripts/chat.js"></script>
</body>
</html>
